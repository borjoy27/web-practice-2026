<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life Is Joy - Joy Mall</title>
    <meta name="description" content="빈티지 악세서리 전문 판매점 Joy Mall 입니다.">
    <meta property="og:description" content="빈티지 악세서리는 Joy Mall">
    <meta property="og:url" content="https://borjoy27.github.io/web-practice-2026/week3">
</head>
<body>
    <header>
        <h1 style="text-align: center;">Life Is <span style="color: yellowgreen;">Joy</span>!</h1>
        <img src="https://img.magnific.com/free-vector/joy-doodle-word-colorful-vector-clipart_53876-177425.jpg?semt=ais_hybrid&w=740&q=80" 
        alt="joy logo"> 
    </header>

    <section>
        <h2>고객센터 문의</h2>
        <article>
            <h3>불만사항 및 문의가 필요하시면 아래 서식을 채워주세요.</h3>
            <form>
                <fieldset>
                        <legend>문의사항</legend>
                        <label for="name">이름</label>
                        <input type="text" id="name">

                        <label for="email">이메일</label>
                        <input type="email" id="email">

                        <label for="category">문의유형</label>
                        <select id="category">
                            <option value="a" selected>상품</option>
                            <option value="b">주문/결제</option>
                            <option value="c">배송</option>
                            <option value="d">환불/교환</option>
                            <option value="e">회원/계정</option>
                            <option value="f">서비스 이용</option>
                            <option value="g">기타</option>
                        </select>

                        <label for="content">문의내용</label>
                        <textarea id="content"></textarea>

                        <button>보내기</button>
                </fieldset>
            </form>
        </article>
    </section>

    
</body>
</html>
