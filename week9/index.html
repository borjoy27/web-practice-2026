<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>9주차 실습 - 폼 · 콤보박스 · 모달</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body, h1, h2, p, ul { margin: 0; padding: 0; }
    ul { list-style: none; }
    button, input { font: inherit; }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: #f1f5f9;
      color: #0f172a;
      padding: 48px 16px;
    }
    .container {
      max-width: 480px;
      margin: 0 auto;
      padding: 32px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.08);
    }
    h1 { font-size: 24px; margin-bottom: 24px; }
    .field { margin-bottom: 20px; }
    .field label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 700;
    }
    input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
    }
    .btn-row { display: flex; gap: 8px; margin-top: 8px; }
    .btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #38bdf8;
      color: #0f172a;
      font-weight: 700;
      cursor: pointer;
    }
    .link-btn {
      margin-top: 16px;
      border: none;
      background: none;
      color: #64748b;
      text-decoration: underline;
      cursor: pointer;
    }

    input:focus {
      outline: none;
      border-color: #38bdf8;
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.25);
    }
    input:disabled {
      background: #e2e8f0;
      color: #94a3b8;
      cursor: not-allowed;
    }
    .msg {
      display: none;
      margin-top: 6px;
      font-size: 12px;
      color: #ef4444;
    }
    .field.error input {
      border-color: #ef4444;
    }
    .field.error input:focus {
      box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.2);
    }
    .field.error .msg {
      display: block;
    }

    .btn:hover:not(:disabled) {
      background: #0ea5e9;
    }
    .btn:active:not(:disabled) {
      background: #0284c7;
      transform: translateY(1px);
    }
    .btn:disabled {
      background: #e2e8f0;
      color: #94a3b8;
      cursor: not-allowed;
    }

    .combo {
      position: relative;
    }
    .combo-btn {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #fff;
      text-align: left;
      cursor: pointer;
    }
    .combo-btn img {
      width: 16px;
      height: 16px;
      transition: transform 0.2s;
    }
    .combo-list {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      width: 100%;
      margin-top: 4px;
      background: #fff;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.08);
      overflow: hidden;
      z-index: 10;
    }
    .combo-list li {
      padding: 12px 16px;
      cursor: pointer;
    }
    .combo-list li:hover {
      background: #f1f5f9;
    }
    .combo.open .combo-list {
      display: block;
    }
    .combo.open .combo-btn img {
      transform: rotate(180deg);
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      justify-content: center;
      align-items: center;
      background: rgba(15, 23, 42, 0.5);
      z-index: 100;
    }
    .modal-box {
      position: relative;
      width: 90%;
      max-width: 400px;
      padding: 32px;
      background: #fff;
      border-radius: 16px;
    }
    .modal-box h2 {
      margin-bottom: 12px;
      font-size: 20px;
    }
    .modal-box p {
      font-size: 14px;
      line-height: 1.6;
      color: #475569;
    }
    .modal .close {
      position: absolute;
      top: 12px;
      right: 12px;
      padding: 4px;
      border: none;
      background: none;
      cursor: pointer;
    }
    .modal .close img {
      display: block;
      width: 20px;
      height: 20px;
    }
    .modal.open {
      display: flex;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>회원가입</h1>

    <div class="field">
      <label for="name">이름</label>
      <input type="text" id="name" placeholder="이름을 입력하세요">
    </div>

    <div class="field error">
      <label for="email">이메일</label>
      <input type="email" id="email" value="abc@jnu">
      <p class="msg">올바른 이메일 형식이 아닙니다.</p>
    </div>

    <div class="field">
      <label for="student-id">학번</label>
      <input type="text" id="student-id" value="2026000000" disabled>
    </div>

    <div class="field">
      <label>관심 분야</label>
      <div class="combo">
        <button type="button" class="combo-btn">
          <span>관심 분야를 선택하세요</span>
          <img src="arrow.svg" alt="">
        </button>
        <ul class="combo-list">
          <li>웹 개발</li>
          <li>데이터 분석</li>
          <li>인공지능</li>
          <li>모바일 앱</li>
        </ul>
      </div>
    </div>

    <div class="btn-row">
      <button class="btn">가입하기</button>
      <button class="btn" disabled>임시 저장</button>
    </div>

    <button class="link-btn">이용약관 보기</button>
  </div>

  <div class="modal">
    <div class="modal-box">
      <button type="button" class="close">
        <img src="close.svg" alt="닫기">
      </button>
      <h2>이용약관</h2>
      <p>본 서비스 이용약관 내용입니다. 회원가입을 진행하시면 약관에 동의한 것으로 간주됩니다.</p>
    </div>
  </div>
</body>
</html>
